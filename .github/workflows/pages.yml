name: Publish static archive
run-name: Publish static archive (${{ github.ref_name }})
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to publish (defaults to the workflow commit)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22', 'lts/*', 'node']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm run verify:build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Install browser for regression tests
        if: matrix.node == 'lts/*'
        # The hosted Ubuntu 24.04 image includes Chromium's system dependencies.
        run: npx playwright install chromium
      - name: Verify desktop and mobile browsers
        if: matrix.node == 'lts/*'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        if: matrix.node == 'lts/*'
        with:
          path: dist/client
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  verify-online:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify deployed content matches this commit
        run: npm run verify:online -- "${{ needs.deploy.outputs.page_url }}"
  cleanup:
    needs: verify-online
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Retain the latest successful Pages deployment
        uses: actions/github-script@v9
        with:
          script: |
            const { cleanupPagesDeployments } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/cleanup-pages-deployments.mjs`
            );
            await cleanupPagesDeployments({ github, context, core });
