name: Publish static archive
run-name: Publish static archive (${{ github.ref_name }})
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22', 'lts/*', 'node']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm run verify:build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Install browser for search regression tests
        if: matrix.node == 'lts/*'
        run: npx playwright install --with-deps chromium
      - name: Verify search in desktop and mobile browsers
        if: matrix.node == 'lts/*'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        if: matrix.node == 'lts/*'
        with:
          path: dist/client
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Retain the latest successful Pages deployment
        uses: actions/github-script@v9
        with:
          script: |
            const { cleanupPagesDeployments } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/cleanup-pages-deployments.mjs`
            );
            await cleanupPagesDeployments({ github, context, core });
