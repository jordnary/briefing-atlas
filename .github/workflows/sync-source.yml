name: Sync private briefing source
run-name: Sync private briefing source (${{ github.ref_name }})
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      accept_revisions:
        description: 'Accept reviewed source revisions and publish them'
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types:
      - briefing-source-updated
permissions:
  contents: write
  actions: write
concurrency:
  group: archive-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install atlas dependencies
        run: npm ci
      - name: Checkout private source repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.BRIEFING_SOURCE_REPO }}
          ref: ${{ vars.BRIEFING_SOURCE_REF || 'main' }}
          token: ${{ secrets.BRIEFING_SOURCE_TOKEN }}
          path: work/source-repository
          persist-credentials: false
      - name: Restore private archive checkpoint
        id: state
        continue-on-error: true
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
        run: |
          mkdir -p work/archive-sync
          set +e
          npm run state:restore 2>&1 | tee work/archive-sync/state-restore.log
          code=${PIPESTATUS[0]}
          error_code=$(tail -n 1 work/archive-sync/state-restore.log | tr -d '\r' | grep -E '^[A-Z][A-Z0-9_]+$' || true)
          echo "error_code=$error_code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Bootstrap private archive checkpoint
        id: bootstrap
        if: steps.state.outcome == 'failure' && vars.BRIEFING_STATE_BOOTSTRAP == 'true'
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
        run: npm run state:bootstrap
      - name: Require initialized private checkpoint
        if: steps.state.outcome == 'failure' && steps.bootstrap.outcome != 'success'
        run: exit 1
      - name: Validate and export source
        id: validate
        working-directory: work/source-repository
        run: |
          npm ci --ignore-scripts
          npm test
          set +e
          validation_output=$(npm run validate -- --require-content 2>&1)
          validation_code=$?
          printf '%s\n' "$validation_output"
          if [ "$validation_code" -ne 0 ]; then
            if printf '%s\n' "$validation_output" | grep -qx 'NO_BRIEFINGS'; then
              echo 'available=false' >> "$GITHUB_OUTPUT"
              echo 'No production briefings available; publication paused.'
              exit 0
            fi
            exit "$validation_code"
          fi
          set -e
          echo 'available=true' >> "$GITHUB_OUTPUT"
          npm run export
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_EXPORT_SHA256=$(sha256sum work/source-export.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Synchronize archive
        id: sync
        if: steps.validate.outputs.available == 'true'
        env:
          SOURCE_DIRECTORY: work/source-repository
          ACCEPT_REVISIONS: ${{ inputs.accept_revisions || 'false' }}
        run: |
          set +e
          npm run sync:source
          code=$?
          set -e
          status=$(node -e 'const fs = require("node:fs"); try { console.log(JSON.parse(fs.readFileSync("work/archive-sync/last-run.json", "utf8")).status || "failure"); } catch { console.log("failure"); }')
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then echo 'pending review; publication paused'; exit 2; fi
          exit "$code"
      - name: Save private archive checkpoint
        if: always() && steps.validate.outputs.available == 'true' && (steps.state.outcome == 'success' || steps.bootstrap.outcome == 'success')
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
        run: npm run state:save
      - name: Validate site
        if: success() && steps.validate.outputs.available == 'true'
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run verify:build
      - name: Commit synchronized public content
        id: commit-content
        if: success() && steps.validate.outputs.available == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/briefings
          if ! git diff --cached --quiet; then
            git commit -m 'feat: sync validated briefings'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        if: success() && steps.validate.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish=false
          if [ "${{ steps.sync.outputs.status }}" != "unchanged" ]; then publish=true; fi
          if [ -f work/archive-sync/state.json ] && node -e "const s=require('./work/archive-sync/state.json'); process.exit(s.publication?.failedStage ? 0 : 1)"; then publish=true; fi
          if [ "$publish" = true ]; then
            commit=$(git rev-parse HEAD)
            if gh run list --workflow pages.yml --commit "$commit" --json status --jq '.[] | select(.status == "queued" or .status == "in_progress") | .status' | grep -q .; then
              echo "Pages deployment for $commit is already running."
              exit 0
            fi
            gh workflow run pages.yml --ref "${GITHUB_REF_NAME:-master}" -f commit="$commit"
            echo "Dispatched Pages deployment for $commit."
          else
            echo 'Archive unchanged and no failed publication; Pages dispatch skipped.'
          fi

      - name: Generate review report
        if: always()
        env:
          REVIEW_STATUS: ${{ steps.sync.outputs.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
          STATE_ERROR_CODE: ${{ steps.state.outputs.error_code }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          node scripts/archive-review.mjs \
            --root work/archive-sync \
            --output work/archive-sync/review-report.md \
            --status "$REVIEW_STATUS" \
            --sync-outcome "$SYNC_OUTCOME" \
            --state-outcome "$STATE_OUTCOME" \
            --validate-outcome "$VALIDATE_OUTCOME" \
            --error-code "$STATE_ERROR_CODE"

      - name: Publish sync status summary
        if: always()
        run: |
          if [ -f work/archive-sync/review-report.md ]; then
            cat work/archive-sync/review-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# Archive sync report' '' '- Status: FAILURE' '- Next action: inspect the failed workflow step and rerun after fixing it.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-review-${{ github.run_id }}
          path: work/archive-sync/review-report.md
          if-no-files-found: ignore
          retention-days: 7

