name: Sync private briefing source
run-name: Sync private briefing source (${{ github.ref_name }})
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Preview changes or approve one pending review'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - approve
      review_id:
        description: 'Review ID shown in the pending run Summary (required for approve)'
        required: false
        type: string
      source_commit:
        description: 'Source commit shown in the pending run Summary (required for approve)'
        required: false
        type: string
  repository_dispatch:
    types:
      - briefing-source-updated
permissions:
  contents: write
jobs:
  sync:
    # Release this lock before invoking the Pages workflow, which acquires the
    # same group for publication and every publication-state write.
    concurrency:
      group: archive-publication-state
      cancel-in-progress: false
    outputs:
      should_publish: ${{ steps.publish-decision.outputs.should_publish }}
      publish_commit: ${{ steps.publish-decision.outputs.publish_commit }}
      review_required: ${{ steps.publish-decision.outputs.review_required }}
      retry_only: ${{ steps.publish-decision.outputs.retry_only }}
      skip_reason: ${{ steps.publish-decision.outputs.skip_reason }}
      source_commit: ${{ steps.commit-content.outputs.source_commit }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install atlas dependencies
        run: npm ci
      - name: Validate approval inputs
        if: inputs.action == 'approve'
        env:
          REVIEW_ID_INPUT: ${{ inputs.review_id }}
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
        run: |
          printf '%s' "$REVIEW_ID_INPUT" | grep -Eq '^[a-f0-9]{64}$' || { echo 'REVIEW_ID_REQUIRED'; exit 1; }
          printf '%s' "$SOURCE_COMMIT_INPUT" | grep -Eq '^[a-f0-9]{40}$' || { echo 'SOURCE_COMMIT_REQUIRED'; exit 1; }
      - name: Checkout private source repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.BRIEFING_SOURCE_REPO }}
          ref: ${{ inputs.source_commit || vars.BRIEFING_SOURCE_REF || 'main' }}
          token: ${{ secrets.BRIEFING_SOURCE_TOKEN }}
          path: work/source-repository
          persist-credentials: false
      - name: Restore private archive checkpoint
        id: state
        continue-on-error: true
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
        run: |
          mkdir -p work/archive-sync
          set +e
          npm run state:restore -- --reconcile-ancestor 2>&1 | tee work/archive-sync/state-restore.log
          code=${PIPESTATUS[0]}
          error_code=$(tail -n 1 work/archive-sync/state-restore.log | tr -d '\r' | grep -E '^[A-Z][A-Z0-9_]+$' || true)
          echo "error_code=$error_code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Bootstrap private archive checkpoint
        id: bootstrap
        if: steps.state.outcome == 'failure' && steps.state.outputs.error_code == 'PRIVATE_STATE_NOT_INITIALIZED' && vars.BRIEFING_STATE_BOOTSTRAP == 'true'
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
        run: npm run state:bootstrap
      - name: Require initialized private checkpoint
        if: steps.state.outcome == 'failure' && steps.bootstrap.outcome != 'success'
        run: exit 1
      - name: Validate and export source
        id: validate
        working-directory: work/source-repository
        run: |
          npm ci --ignore-scripts
          npm test
          set +e
          validation_output=$(npm run validate -- --require-content 2>&1)
          validation_code=$?
          printf '%s\n' "$validation_output"
          if [ "$validation_code" -ne 0 ]; then
            if printf '%s\n' "$validation_output" | grep -qx 'NO_BRIEFINGS'; then
              echo 'available=false' >> "$GITHUB_OUTPUT"
              echo 'No production briefings available; publication paused.'
              exit 0
            fi
            exit "$validation_code"
          fi
          set -e
          echo 'available=true' >> "$GITHUB_OUTPUT"
          npm run export
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_EXPORT_SHA256=$(sha256sum work/source-export.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Synchronize archive
        id: sync
        if: steps.validate.outputs.available == 'true'
        env:
          SOURCE_DIRECTORY: work/source-repository
          ACCEPT_REVISIONS: ${{ inputs.action == 'approve' && 'true' || 'false' }}
          REVIEW_ID: ${{ inputs.review_id }}
        run: |
          set +e
          npm run sync:source 2>&1 | tee work/archive-sync/sync.log
          code=${PIPESTATUS[0]}
          set -e
          error_code=$(tail -n 1 work/archive-sync/sync.log | tr -d '\r' | grep -E '^[A-Z][A-Z0-9_]+$' || true)
          status=$(node -e 'const fs = require("node:fs"); try { console.log(JSON.parse(fs.readFileSync("work/archive-sync/last-run.json", "utf8")).status || "failure"); } catch { console.log("failure"); }')
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "error_code=$error_code" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then echo 'pending review; publication paused'; exit 2; fi
          exit "$code"
      - name: Save pending review checkpoint
        id: save-review
        if: always() && steps.sync.outputs.status == 'pending' && steps.state.outcome == 'success'
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
          # Pending review pins the proposed source separately. The committed
          # archive retains its existing checkpoint source binding.
          SOURCE_COMMIT: ''
        run: npm run state:save
      - name: Validate site
        if: success() && steps.validate.outputs.available == 'true'
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run verify:build
      - name: Commit synchronized public content
        id: commit-content
        if: success() && steps.validate.outputs.available == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/briefings
          if ! git diff --cached --quiet; then
            git commit -m 'feat: sync validated briefings'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Prepare private archive checkpoint
        id: prepare-state
        if: success() && steps.commit-content.outcome == 'success' && (steps.state.outcome == 'success' || steps.bootstrap.outcome == 'success')
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
          PUBLIC_COMMIT: ${{ steps.commit-content.outputs.commit_sha }}
        run: npm run state:prepare
      - name: Push the checkpoint-bound public commit
        id: push-content
        if: success() && steps.prepare-state.outcome == 'success'
        run: git push origin HEAD:master
      - name: Save private archive checkpoint
        id: save-state
        if: success() && steps.validate.outputs.available == 'true' && steps.push-content.outcome == 'success' && (steps.state.outcome == 'success' || steps.bootstrap.outcome == 'success')
        env:
          BRIEFING_STATE_REPO: ${{ vars.BRIEFING_STATE_REPO || vars.BRIEFING_SOURCE_REPO }}
          BRIEFING_STATE_BRANCH: ${{ vars.BRIEFING_STATE_BRANCH || 'atlas-sync-state' }}
          BRIEFING_STATE_TOKEN: ${{ secrets.BRIEFING_STATE_TOKEN }}
          PUBLIC_COMMIT: ${{ steps.commit-content.outputs.commit_sha }}
        run: npm run state:save
      - name: Decide Pages publication
        id: publish-decision
        if: always()
        env:
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
          STATE_ERROR_CODE: ${{ steps.state.outputs.error_code }}
          SYNC_ERROR_CODE: ${{ steps.sync.outputs.error_code }}
          COMMIT_OUTCOME: ${{ steps.commit-content.outcome }}
          PUSH_OUTCOME: ${{ steps.push-content.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-state.outcome }}
          SAVE_OUTCOME: ${{ steps.save-state.outcome }}
          PENDING_SAVE_OUTCOME: ${{ steps.save-review.outcome }}
          COMMIT_SHA: ${{ steps.commit-content.outputs.commit_sha }}
          COMMIT_CHANGED: ${{ steps.commit-content.outputs.changed }}
        run: |
          set -euo pipefail
          commit="${COMMIT_SHA:-}"
          status=$(printf '%s' "${SYNC_STATUS:-}" | tr '[:upper:]' '[:lower:]')
          should_publish=false
          retry_only=false
          review_required=false
          reason='sync_failed'
          if printf '%s\n%s' "${STATE_ERROR_CODE:-}" "${SYNC_ERROR_CODE:-}" | grep -q 'CONFLICT'; then
            review_required=true; reason='checkpoint_or_date_conflict'
          elif [ "${PENDING_SAVE_OUTCOME:-}" = failure ]; then
            review_required=true; reason='pending_checkpoint_save_failed'
          elif [ "$status" = pending ]; then
            review_required=true; reason='pending_review'
          elif [ "$status" = conflict ]; then
            review_required=true; reason='checkpoint_or_date_conflict'
          elif [ "${SYNC_OUTCOME:-}" = failure ] || [ "${VALIDATE_OUTCOME:-}" = failure ] || [ "${STATE_OUTCOME:-}" = failure ] || [ "${PREPARE_OUTCOME:-}" = failure ] || [ "${COMMIT_OUTCOME:-}" = failure ] || [ "${PUSH_OUTCOME:-}" = failure ] || [ "${SAVE_OUTCOME:-}" = failure ]; then
            reason='sync_failed'
          elif [ "$status" = unchanged ]; then
            if [ -f work/archive-sync/state.json ] && node -e "const s=require('./work/archive-sync/state.json'); process.exit(s.publication?.failedStage ? 0 : 1)"; then
              should_publish=true; retry_only=true; reason='retry_failed_publication'
            elif [ -f work/archive-sync/state.json ] && node -e "const s=require('./work/archive-sync/state.json'); process.exit(s.publication?.stage === 'archived' ? 0 : 1)"; then
              should_publish=true; reason='unpublished_commit'
            else
              reason='archive_unchanged'
            fi
          elif [ "$status" = archived ] || [ "$status" = success ]; then
            should_publish=true; reason='synchronized_content'
          elif [ "$status" = reconciled ]; then
            if [ -f work/archive-sync/state.json ] && node -e "const s=require('./work/archive-sync/state.json'); process.exit(s.publication?.failedStage ? 0 : 1)"; then
              should_publish=true; retry_only=true; reason='retry_failed_publication'
            elif [ -f work/archive-sync/state.json ] && node -e "const s=require('./work/archive-sync/state.json'); process.exit(s.publication?.stage === 'archived' ? 0 : 1)"; then
              should_publish=true; reason='unpublished_commit'
            elif [ "${COMMIT_CHANGED:-false}" = true ]; then
              should_publish=true; reason='synchronized_content'
            else
              reason='archive_unchanged'
            fi
          elif [ "${VALIDATE_OUTCOME:-}" = success ] && [ "${{ steps.validate.outputs.available }}" != 'true' ]; then
            reason='no_briefings_available'
          else
            reason='sync_failed'
          fi
          if [ -z "$commit" ] && [ "$should_publish" = true ]; then should_publish=false; reason='no_publish_commit'; fi
          {
            echo "should_publish=$should_publish"
            echo "publish_commit=$commit"
            echo "review_required=$review_required"
            echo "retry_only=$retry_only"
            echo "skip_reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Generate review report
        if: always()
        env:
          REVIEW_STATUS: ${{ steps.sync.outputs.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
          STATE_ERROR_CODE: ${{ steps.state.outputs.error_code }}
          SYNC_ERROR_CODE: ${{ steps.sync.outputs.error_code }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          error_code="${SYNC_ERROR_CODE:-${STATE_ERROR_CODE:-}}"
          node scripts/archive-review.mjs \
            --root work/archive-sync \
            --output work/archive-sync/review-report.md \
            --status "$REVIEW_STATUS" \
            --sync-outcome "$SYNC_OUTCOME" \
            --state-outcome "$STATE_OUTCOME" \
            --validate-outcome "$VALIDATE_OUTCOME" \
            --error-code "$error_code" \
            --metadata-only

      - name: Publish sync status summary
        if: always()
        run: |
          if [ -f work/archive-sync/review-report.md ]; then
            cat work/archive-sync/review-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# Archive sync report' '' '- Status: FAILURE' '- Next action: inspect the failed workflow step and rerun after fixing it.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/archive-sync/state-restore.log ]; then
            conflicts=$(grep '^Checkpoint conflict ' work/archive-sync/state-restore.log || true)
            if [ -n "$conflicts" ]; then
              printf '%s\n' '' '## Checkpoint conflict diagnostics (hashes only)' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          printf '%s\n' '' '## Pages publication decision' \
            "- should_publish: ${{ steps.publish-decision.outputs.should_publish }}" \
            "- publish_commit: ${{ steps.publish-decision.outputs.publish_commit || 'none' }}" \
            "- review_required: ${{ steps.publish-decision.outputs.review_required }}" \
            "- retry_only: ${{ steps.publish-decision.outputs.retry_only }}" \
            "- skipped_reason: ${{ steps.publish-decision.outputs.skip_reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.save-review.outcome }}" = failure ]; then
            printf '%s\n' '- private review checkpoint: FAILED; inspect the checkpoint write error before approving this review.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-review-${{ github.run_id }}
          path: work/archive-sync/review-report.md
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: sync
    if: needs.sync.outputs.should_publish == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    with:
      commit: ${{ needs.sync.outputs.publish_commit }}
      source_commit: ${{ needs.sync.outputs.source_commit }}
    secrets: inherit
