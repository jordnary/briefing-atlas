name: Retry Pages publication
run-name: Retry Pages publication (${{ inputs.commit || github.ref_name }})
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Public commit to republish (defaults to latest master)'
        required: false
        type: string
      retry_stage:
        description: 'Failed stage to retry (build, deploy, or verify)'
        required: false
        type: choice
        options: [build, deploy, verify]
permissions:
  contents: read
jobs:
  # The called Pages workflow owns archive-publication-state for its entire
  # run. A caller lock in that group would deadlock the reusable workflow.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve publication commit
        id: commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          commit="${REQUESTED_COMMIT:-$(git rev-parse origin/master)}"
          printf '%s' "$commit" | grep -Eq '^[a-f0-9]{40}$' || { echo 'PUBLIC_COMMIT_REQUIRED'; exit 1; }
          git cat-file -e "$commit^{commit}" || { echo 'PUBLIC_COMMIT_NOT_FOUND'; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  publish:
    needs: resolve
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      retry_stage: ${{ inputs.retry_stage }}
    secrets: inherit
